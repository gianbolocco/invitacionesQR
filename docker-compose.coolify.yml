# Despliegue en Coolify.
#
# Se usa SOLO, no junto al docker-compose.yml de desarrollo: Coolify construye
# desde el repo y no necesita nada de aquel (puertos publicados al host,
# contraseña fija de la base).
#
# En Coolify: New Resource -> Docker Compose -> este repo, rama main,
# y "Docker Compose Location" = /docker-compose.coolify.yml
#
# ---------------------------------------------------------------------------
# Por qué hay un Caddy si Coolify ya trae proxy
# ---------------------------------------------------------------------------
# El front llama a la API con la ruta relativa /api, así que los dos tienen que
# vivir detrás del MISMO origen. Eso trae tres cosas que no son cosméticas: no
# hay CORS, la cookie de sesión es first-party, y la imagen del front no lleva
# ningún dominio horneado adentro —sirve igual en cualquier URL—.
#
# Caddy hace ese reparto adentro del stack, y a Coolify se le expone un solo
# servicio. El TLS lo termina el proxy de Coolify, así que acá Caddy sirve HTTP
# plano (SITIO=':80'); no hay certificados duplicados.
#
# Si tu versión de Coolify soporta FQDN con path (https://dominio/api apuntando
# al servicio api), podés borrar el servicio caddy y mapear web y api por
# separado. Funciona igual; esto es lo que no depende de la versión.
# ---------------------------------------------------------------------------
#
# ---------------------------------------------------------------------------
# La base va aparte
# ---------------------------------------------------------------------------
# Postgres NO está en este compose: es un recurso de base de datos propio de
# Coolify (New Resource -> Database -> PostgreSQL). Dos razones:
#   - Los backups programados a S3 de Coolify son para esos recursos.
#   - Rehacer o borrar este recurso no puede llevarse los datos del barrio.
# La base no guarda nada fuera de sí misma (el logo vive en una columna), así
# que su backup es el backup de toda la instalación.
#
# Para que la API la alcance, este recurso tiene que estar en la misma red:
# activar "Connect To Predefined Network" en su configuración.
# ---------------------------------------------------------------------------
#
# Variables a cargar en Coolify (Environment Variables del recurso):
#
#   DATABASE_URL        la "Postgres URL (internal)" del recurso de base de datos
#   DOMINIO             el dominio público, sin https:// (ej: invitaciones.tudominio.com)
#   RESEND_API_KEY      obligatoria: sin ella la API no arranca (los links de
#                       alta y reset terminarían impresos en el log)
#   MAIL_FROM           obligatoria, ej: Los Aromos <invitaciones@tudominio.com>
#   GOOGLE_CLIENT_ID    opcional
#   GOOGLE_CLIENT_SECRET opcional
#
# El dominio se configura además en la UI, sobre el servicio `caddy`.

services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      # 'production' es lo que hace que la cookie de sesión salga con Secure.
      NODE_ENV: production
      # La base es otro recurso de Coolify: ver "La base va aparte" arriba.
      DATABASE_URL: ${DATABASE_URL:?falta DATABASE_URL}
      PORT: 8080
      # De acá salen los links de los mails de alta y de reset. Es la única
      # variable que necesita el dominio real.
      WEB_ORIGIN: https://${DOMINIO:?falta DOMINIO}
      # El redirect URI que hay que registrar en Google Cloud queda entonces:
      #   https://$DOMINIO/api/auth/google/callback
      API_ORIGIN: https://${DOMINIO}/api
      RESEND_API_KEY: ${RESEND_API_KEY:?falta RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM:?falta MAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # El barrio de esta instalación. Se siembra al primer arranque; si la
      # base ya tiene uno, no se hace nada.
      ADMIN_EMAIL: ${ADMIN_EMAIL:?falta ADMIN_EMAIL}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-}
    # /health chequea app y base. node -e con fetch porque node:24-slim no
    # trae curl ni wget. start_period: al arrancar corre migración y siembra.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./web
      args:
        # Relativo a propósito: ver el comentario de arriba.
        NEXT_PUBLIC_API_URL: /api
    restart: unless-stopped
    environment:
      # Lo usa el layout de Next para leer la marca desde adentro de la red.
      API_INTERNAL_URL: http://api:8080
    depends_on: [api]
    # La raíz alcanza: solo hace falta saber que Next sirve. fetch sigue el
    # redirect a /login si lo hubiera.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # El único servicio que Coolify expone al exterior.
  #
  # El Caddyfile va horneado en la imagen (ver Dockerfile.caddy) y no montado
  # con un bind: en Coolify el repo no vive en el host, y Docker resuelve un
  # bind de archivo inexistente creando un directorio vacío ("not a directory").
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    expose: ['80']
    environment:
      SITIO: ':80'
      # Solo en qa: NOINDEX=1 para que los buscadores no la indexen.
      NOINDEX: ${NOINDEX:-}
    depends_on: [web, api]
    # Es el servicio que Coolify expone, así que es el que reporta el estado del
    # recurso. Pega a /api/health A TRAVÉS de Caddy: un solo chequeo cubre el
    # proxy, la API y la base. wget porque la imagen alpine lo trae y curl no.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

